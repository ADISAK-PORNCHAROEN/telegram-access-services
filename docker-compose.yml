name: telegram-access-services

services:
  database:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: telegram_service
      POSTGRES_USER: telegram_service
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Run scripts/setup_env.ps1 -Docker first}"
    volumes:
      - customer-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - customer

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["telegram-service-migrate"]
    environment:
      DATABASE_URL: "postgresql://telegram_service:${POSTGRES_PASSWORD:?Run scripts/setup_env.ps1 -Docker first}@database:5432/telegram_service"
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    networks:
      - customer

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://telegram_service:${POSTGRES_PASSWORD:?Run scripts/setup_env.ps1 -Docker first}@database:5432/telegram_service"
      JOB_EXECUTION_MODE: durable
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${SETUP_BIND_ADDRESS:-127.0.0.1}:${SETUP_PORT:-8765}:${SETUP_PORT:-8765}"
    volumes:
      - customer-app-data:/data
      - customer-media:/data/tmp
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - customer

networks:
  customer:
    driver: bridge

volumes:
  customer-app-data:
  customer-media:
  customer-postgres-data:
